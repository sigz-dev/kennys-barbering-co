  <div class="modal" id="offerModal" data-modal hidden>
    <button class="modal__backdrop" type="button" data-modal-close tabindex="-1" aria-hidden="true"></button>

    <div class="modal__card" role="dialog" aria-modal="true"
         aria-labelledby="offerTitle" aria-describedby="offerText">

      <button class="modal__close" type="button" data-modal-close aria-label="Close this offer">
        <svg viewBox="0 0 16 16" aria-hidden="true" focusable="false">
          <path d="M2 2l12 12M14 2L2 14" fill="none" stroke="currentColor"
                stroke-width="1.6" stroke-linecap="round"/>
        </svg>
      </button>

      <div class="modal__media">
        <img src="./assets/img/shop-chair-640.jpg"
             srcset="./assets/img/shop-chair-640.jpg 640w, ./assets/img/shop-chair-1280.jpg 1280w"
             sizes="(max-width: 760px) 0px, 360px"
             alt="A vintage barber's chair in the shop at Kenny's Barbering Co."
             width="640" height="800" loading="lazy" decoding="async">
      </div>

      <div class="modal__body">
        <p class="eyebrow eyebrow--plain">{{ offer.eyebrow }}</p>
        <h2 class="modal__title" id="offerTitle">{{ offer.title }}</h2>
        <p class="modal__text" id="offerText">{{ offer.body }}</p>

        <div class="promo">
          <span>
            <span class="promo__k">Your code</span><br>
            <span class="promo__v" data-promo-code>{{ offer.code }}</span>
          </span>
          <button class="promo__copy" type="button" data-copy="{{ offer.code }}">Copy</button>
        </div>

        <a class="btn btn--primary" href="booking.html" data-modal-book>
          Book my first visit
          <svg class="btn__arrow" viewBox="0 0 16 16" aria-hidden="true" focusable="false">
            <path d="M1 8h13M9 3l5 5-5 5" fill="none" stroke="currentColor"
                  stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </a>

        <button class="modal__dismiss" type="button" data-modal-close>No thanks, maybe next time</button>
        <p class="modal__fine">{{ offer.terms }}</p>
      </div>
    </div>
  </div>
