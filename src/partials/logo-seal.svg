  </defs>
  <circle cx="60" cy="60" r="57" fill="none" stroke="var(--brass)" stroke-width="1.6"/>
  <circle cx="60" cy="60" r="52" fill="none" stroke="var(--brass)" stroke-width=".7" opacity=".5"/>

  <text class="logoseal__arc" fill="var(--brass)">
